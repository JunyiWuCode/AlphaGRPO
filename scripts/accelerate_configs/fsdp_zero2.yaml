compute_environment: LOCAL_MACHINE
debug: false
distributed_type: FSDP
fsdp_config:
  # SHARD_GRAD_OP = ZeRO-2: shard gradients + optimizer states, keep full params on each GPU.
  # No all-gather needed during forward/backward, so no memory spikes.
  fsdp_sharding_strategy: SHARD_GRAD_OP

  fsdp_auto_wrap_policy: TRANSFORMER_BASED_WRAP
  # Main transformer layer class for BAGEL (Mixture-of-Transformers).
  # Add more classes comma-separated if needed: "Qwen2MoTDecoderLayer,SiglipEncoderLayer"
  fsdp_transformer_layer_cls_to_wrap: Qwen2MoTDecoderLayer

  fsdp_backward_prefetch_policy: BACKWARD_PRE
  fsdp_forward_prefetch: false
  fsdp_offload_params: false
  fsdp_cpu_ram_efficient_loading: true
  fsdp_sync_module_states: true
  fsdp_use_orig_params: true
  fsdp_state_dict_type: FULL_STATE_DICT

machine_rank: 0
main_training_function: main
mixed_precision: bf16
num_machines: 1
num_processes: 2
rdzv_backend: static
same_network: true
use_cpu: false
